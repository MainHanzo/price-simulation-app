<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f0e9" />
    <title>Sign in · Price Generator</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f1f0e9;
        --paper-bright: #faf9f4;
        --ink: #182a23;
        --muted: #727a70;
        --line: #d8d9cf;
        --green: #557b48;
        --lime: #b8f56c;
        --sans: 'DM Sans', 'Avenir Next', 'Segoe UI', sans-serif;
        --mono: 'DM Mono', 'SFMono-Regular', Consolas, monospace;
      }

      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: 76px 1fr;
        padding: 0 max(24px, calc((100vw - 1240px) / 2));
        color: var(--ink);
        background: radial-gradient(ellipse at 12% -15%, rgba(255,255,255,.78), transparent 44%), var(--paper);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
      .brand-mark { width: 26px; height: 26px; display: flex; align-items: end; gap: 3px; padding: 5px; border-radius: 8px; background: var(--ink); }
      .brand-mark i { display: block; width: 3px; border-radius: 2px; background: var(--lime); }
      .brand-mark i:nth-child(1) { height: 8px; }
      .brand-mark i:nth-child(2) { height: 13px; }
      .brand-mark i:nth-child(3) { height: 10px; }
      .brand-mark i:nth-child(4) { height: 16px; }
      .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.045em; }
      .brand-name span { color: #779a62; }
      .product-label { margin-left: 17px; padding-left: 17px; border-left: 1px solid var(--line); color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }
      main { display: grid; place-items: center; padding: 48px 0 80px; }
      .login-panel { width: min(100%, 390px); padding: 34px 36px 31px; border: 1px solid #d9dacf; border-radius: 10px; background: rgba(250,249,244,.82); box-shadow: 0 16px 44px rgba(32,47,33,.08); animation: arrive .35s ease both; }
      .eyebrow { margin: 0 0 12px; color: #70806d; font: 10px var(--mono); letter-spacing: .12em; }
      h1 { margin: 0; font: 500 30px/1.12 Georgia, serif; letter-spacing: -.035em; }
      .intro { margin: 10px 0 25px; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .field { display: grid; gap: 7px; margin-top: 16px; }
      label { color: #687267; font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      input { width: 100%; height: 43px; padding: 0 12px; border: 1px solid #d0d3c9; border-radius: 5px; color: var(--ink); background: var(--paper-bright); font: 14px var(--sans); }
      input:focus-visible, button:focus-visible { outline: 3px solid #8aad73; outline-offset: 2px; }
      button { width: 100%; height: 43px; margin-top: 22px; border: 0; border-radius: 5px; color: #eff6e9; background: var(--ink); font: 600 12px var(--sans); cursor: pointer; transition: background .16s ease, transform .16s ease; }
      button:hover:not(:disabled) { background: #28463a; transform: translateY(-1px); }
      button:disabled { opacity: .64; cursor: wait; }
      #loginError { min-height: 18px; margin: 12px 0 0; color: #9d453b; font-size: 12px; line-height: 1.5; }
      .shared-session { margin: 14px 0 0; padding-top: 15px; border-top: 1px solid var(--line); color: #7c8478; font: 10px/1.55 var(--mono); }
      @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 520px) {
        body { grid-template-rows: 65px 1fr; padding-right: 16px; padding-left: 16px; }
        .login-panel { padding: 28px 23px 24px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./" aria-label="Price Generator">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">market<span>lab</span></span>
      </a>
      <span class="product-label">PRICE GENERATOR</span>
    </header>
    <main>
      <form class="login-panel" id="loginForm">
        <p class="eyebrow">PRIVATE MARKET LAB</p>
        <h1>Welcome back</h1>
        <p class="intro">Sign in with your ticker info account to continue.</p>
        <div class="field">
          <label for="username">User</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="loginButton" type="submit">Sign in</button>
        <p id="loginError" role="alert" aria-live="polite"></p>
        <p class="shared-session">Your existing ticker info session works here too.</p>
      </form>
    </main>
    <script>
      const form = document.querySelector('#loginForm');
      const button = document.querySelector('#loginButton');
      const error = document.querySelector('#loginError');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = 'Signing in…';
        error.textContent = '';
        try {
          const response = await fetch(`${window.location.origin}/v1/auth/login`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.querySelector('#username').value.trim(),
              password: document.querySelector('#password').value,
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || `Sign-in failed (${response.status})`);
          document.querySelector('#password').value = '';
          window.location.reload();
        } catch (failure) {
          error.textContent = failure.message || 'Sign-in failed. Try again.';
          document.querySelector('#password').value = '';
          document.querySelector('#password').focus();
        } finally {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });
    </script>
  </body>
</html>
